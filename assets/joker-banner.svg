<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12002b"/>
      <stop offset="0.5" stop-color="#3b0a6e"/>
      <stop offset="1" stop-color="#12002b"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="grin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39ff14"/>
      <stop offset="1" stop-color="#b44cff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="300" rx="18" fill="url(#bg)"/>

  <!-- floating card suits -->
  <g font-family="Georgia, serif" font-size="34" opacity="0.35" filter="url(#glow)">
    <text x="60" y="80" fill="#b44cff">♠<animate attributeName="y" values="80;60;80" dur="4s" repeatCount="indefinite"/></text>
    <text x="800" y="90" fill="#39ff14">♦<animate attributeName="y" values="90;112;90" dur="5s" repeatCount="indefinite"/></text>
    <text x="150" y="250" fill="#39ff14">♣<animate attributeName="y" values="250;228;250" dur="4.5s" repeatCount="indefinite"/></text>
    <text x="740" y="255" fill="#b44cff">♥<animate attributeName="y" values="255;235;255" dur="3.8s" repeatCount="indefinite"/></text>
  </g>

  <!-- title -->
  <text x="450" y="118" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="60" fill="#e9c7ff" filter="url(#glow)" letter-spacing="4">
    WHY SO SERIOUS?
    <animate attributeName="opacity" values="1;0.75;1;0.9;1" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="450" y="152" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" fill="#39ff14">
    &lt;/ Wendell Cavalcante /&gt;
  </text>

  <!-- Joker grin -->
  <path d="M250 200 Q450 300 650 200" fill="none" stroke="url(#grin)" stroke-width="10" stroke-linecap="round" filter="url(#glow)">
    <animate attributeName="d" values="M250 200 Q450 300 650 200;M250 195 Q450 265 650 195;M250 200 Q450 300 650 200" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <path d="M250 200 q-18 -22 -34 -4 M650 200 q18 -22 34 -4" fill="none" stroke="#39ff14" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>

  <!-- bouncing balls -->
  <circle cx="330" cy="230" r="14" fill="#39ff14" filter="url(#glow)">
    <animate attributeName="cy" values="230;175;230" dur="1s" repeatCount="indefinite" calcMode="spline" keySplines="0.3 0 0.7 1;0.3 0 0.7 1" keyTimes="0;0.5;1"/>
  </circle>
  <circle cx="400" cy="245" r="12" fill="#b44cff" filter="url(#glow)">
    <animate attributeName="cy" values="245;185;245" dur="1.3s" repeatCount="indefinite" calcMode="spline" keySplines="0.3 0 0.7 1;0.3 0 0.7 1" keyTimes="0;0.5;1"/>
  </circle>
  <circle cx="450" cy="250" r="16" fill="#ff2ec4" filter="url(#glow)">
    <animate attributeName="cy" values="250;180;250" dur="0.9s" repeatCount="indefinite" calcMode="spline" keySplines="0.3 0 0.7 1;0.3 0 0.7 1" keyTimes="0;0.5;1"/>
  </circle>
  <circle cx="500" cy="245" r="12" fill="#39ff14" filter="url(#glow)">
    <animate attributeName="cy" values="245;185;245" dur="1.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.3 0 0.7 1;0.3 0 0.7 1" keyTimes="0;0.5;1"/>
  </circle>
  <circle cx="570" cy="230" r="14" fill="#b44cff" filter="url(#glow)">
    <animate attributeName="cy" values="230;175;230" dur="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.3 0 0.7 1;0.3 0 0.7 1" keyTimes="0;0.5;1"/>
  </circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
