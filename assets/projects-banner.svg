<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b0a6e"/>
      <stop offset="0.5" stop-color="#7a1fd1"/>
      <stop offset="1" stop-color="#3b0a6e"/>
      <animate attributeName="x1" values="-1;0;-1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1;0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="10" y="10" width="880" height="130" rx="22" fill="url(#g)" stroke="#39ff14" stroke-width="4" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </rect>

  <text x="450" y="72" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="46" fill="#ffffff" letter-spacing="3">
    VEJA MEUS PROJETOS
  </text>
  <text x="450" y="108" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#39ff14">
    clique aqui e confira o que eu ando construindo
  </text>

  <g fill="#39ff14" filter="url(#glow)">
    <polygon points="90,50 130,75 90,100">
      <animateTransform attributeName="transform" type="translate" values="0 0;14 0;0 0" dur="1s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="810,50 770,75 810,100">
      <animateTransform attributeName="transform" type="translate" values="0 0;-14 0;0 0" dur="1s" repeatCount="indefinite"/>
    </polygon>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
