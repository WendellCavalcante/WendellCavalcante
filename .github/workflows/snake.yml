name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#39ff14&color_dots=#2a0a4a,#5b1a9e,#8a2be2,#b44cff,#e0a8ff
            dist/snake-dark.svg?palette=github-dark&color_snake=#39ff14&color_dots=#2a0a4a,#5b1a9e,#8a2be2,#b44cff,#e0a8ff

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
